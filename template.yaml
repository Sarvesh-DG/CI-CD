AWSTemplateFormatVersion: "2010-09-09"
Description: Calculator Lambda deployment using CloudFormation

Parameters:
  DeploymentBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment ZIP

  DeploymentKey:
    Type: String
    Default: function.zip
    Description: S3 object key for the Lambda ZIP file

Resources:
  CalculatorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CalculatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: calculator-app
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt CalculatorExecutionRole.Arn
      Timeout: 10
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref DeploymentKey

Outputs:
  CalculatorFunctionName:
    Description: Deployed Lambda function name
    Value: !Ref CalculatorFunction

  CalculatorFunctionArn:
    Description: Deployed Lambda function ARN
    Value: !GetAtt CalculatorFunction.Arn