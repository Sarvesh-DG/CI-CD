name: Calculator CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-calculator .

      - name: Run unit tests inside Docker
        run: docker run --rm python-calculator python -m unittest -v test_calculator